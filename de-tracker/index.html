<script>
(function(){
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function dec(obj, pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(obj.salt), iterations: obj.iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(obj.iv)}, key, b64(obj.ct)));
  }
  async function open(pw) {
    const page = await dec(JSON.parse(document.getElementById('payload').textContent), pw);
    let status = 'window.TRIG = null;';
    try { const r = await fetch('status.enc?t=' + Date.now(), {cache: 'no-store'}); if (r.ok) status = await dec(await r.json(), pw); } catch (e) {}
    const END = '<' + '/script>';   // never write the closing tag literally inside this inline script
    const inl = js => '<script>' + js.split('<' + '/script').join('<\\/script') + END;
    const html = page.replace('<script src="trigger_status.js">' + END, () => inl(status));
    try { sessionStorage.setItem('de_pw', pw); } catch (e) {}
    document.open(); document.write(html); document.close();
  }
  const f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
  f.addEventListener('submit', async e => {
    e.preventDefault(); err.textContent = ''; go.disabled = true; go.textContent = 'Unlocking...';
    try { await open(document.getElementById('pw').value); }
    catch (x) { err.textContent = 'That password did not work. Check it and try again.'; go.disabled = false; go.textContent = 'Unlock'; }
  });
  let saved = null; try { saved = sessionStorage.getItem('de_pw'); } catch (e) {}
  if (saved) open(saved).catch(() => { try { sessionStorage.removeItem('de_pw'); } catch (e) {} });
})();
</script>
